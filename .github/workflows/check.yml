name: check

# CI gate for this repo. Auto-merge is only as safe as what runs here, so this is what
# you mark required on `develop`.

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the pkgs.nodejs_22 pinned in flake.nix.
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test

      # Not `yarn build`: that chains update-assets.mjs, which resolves ../../sites and
      # rewrites a bench's assets.json -- there is no bench in CI. Build the Vite bundle
      # directly; it is what a dependency bump can actually break. It exercises the whole
      # Tailwind 3 + PostCSS chain, including any attempt to slip past the tailwindcss < 4 cap.
      - run: yarn build:bundle

      # The bundle loads on every desk page, so a rule that escapes `.frappe-editor-root`
      # restyles the whole desk. A frappe-ui bump is the usual way one gets in.
      - run: yarn check:scope
