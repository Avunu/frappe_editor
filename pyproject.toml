[project]
name = "frappe_editor"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Incorporate the Text Editor control from Frappe UI into the Frappe Framework. Who's not to like?"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
	# "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
# check.yml stays until the managed CI callers land, so the PR keeps a gate; drop this then.
retire-keep = [".github/workflows/check.yml"]

# Until the follow-up typing PR: the four files below still use `any` (frappe-ui ships no types for
# its editor), which the locked typescript/no-explicit-any rule refuses. Restore the lock with it.
[tool.frappe-nix.js]
locked-rules = false

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["src/FrappeEditor.vue", "src/control.ts", "src/types/frappe-ui-editor.d.ts", "src/upload.ts"]
rules = { "typescript/no-explicit-any" = "off" }

# XMLHttpRequest's on<event> handlers, one per request: same behaviour, left for the typing PR.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["src/upload.ts"]
rules = { "unicorn/prefer-add-event-listener" = "off" }

# The desk entry's stylesheet import, as the managed *.bundle.ts override allows.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["src/index.ts"]
rules = { "import/no-unassigned-import" = "off" }

# A build-time CLI check: it reports on stdout, and postcss's default export is its API.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["build/check-scope.mjs"]
rules = { "no-console" = "off", "import/no-named-as-default-member" = "off" }

[tool.frappe-nix.dev-shell]
frappe-nix-url = "github:Avunu/frappe-nix/e95f67f97de1322c89df9ffbc9218c31d4ca83ba"

# The desk bundle: Vue SFCs built by the root vite.config.ts, checked by vue-tsc through
# the TS 5 alias (TS 7's tsc can't check .vue imports), so it keeps its own tsconfig.json.
[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["src/**", "build/**", "vite.config.ts"]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["frappe_editor"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 0

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*"]
