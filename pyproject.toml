[project]
name = "frappe_editor"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Incorporate the Text Editor control from Frappe UI into the Frappe Framework. Who's not to like?"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
# check.yml stays until the managed CI callers land, so the PR keeps a gate; drop this then.
retire-keep = [".github/workflows/check.yml"]

[tool.frappe-nix.dev-shell]
frappe-nix-url = "github:Avunu/frappe-nix/b4d0f2784987187e6286a957d5cade3a400730ae"

# The desk bundle: Vue SFCs built by the root vite.config.ts, checked by vue-tsc through
# the TS 5 alias (TS 7's tsc can't check .vue imports), so it keeps its own tsconfig.json.
[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["src/**", "build/**", "vite.config.ts"]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["frappe_editor"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 0

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*"]
